name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # ubuntu-latest 已预装 Android SDK（ANDROID_HOME 已设置），因此不再使用
      # android-actions/setup-android@v3：该 action 内部会执行 `sdkmanager tools`，
      # 而 "tools" 包已被 Google 从仓库移除，每个 run 都会在 setup 阶段直接失败。
      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n 1)
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: gentle-alarm-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
